<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Brána – Odesílání SMS zdarma | Koloběžník.cz</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --green: #10b981;
            --yellow: #f59e0b;
            --red: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }
        header {
            text-align: center;
            padding: 2.5rem 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .back-link {
            display: inline-block;
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: var(--accent);
        }
        header h1 {
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }
        header p {
            color: var(--muted);
            max-width: 650px;
            margin: 0 auto;
        }
        .controls {
            max-width: 900px;
            width: 100%;
            margin: 1.5rem auto 0;
            padding: 0 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
        }
        .search-input {
            flex: 1;
            min-width: 240px;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: var(--card);
            color: var(--text);
            font-size: 1rem;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .filter-btn {
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background-color: var(--card);
            color: var(--muted);
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            color: var(--accent);
        }
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
        }
        .gateway-card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 1.4rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }
        .gateway-card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.4);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
        }
        .gateway-card h2 {
            font-size: 1.2rem;
            color: var(--text);
        }
        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge-ok {
            background: rgba(16, 185, 129, 0.15);
            color: var(--green);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .badge-reg {
            background: rgba(245, 158, 11, 0.15);
            color: var(--yellow);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .badge-limit {
            background: rgba(239, 68, 68, 0.15);
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .gateway-info {
            font-size: 0.9rem;
            color: var(--muted);
            margin-bottom: 1.2rem;
        }
        .gateway-info p {
            margin-bottom: 0.4rem;
        }
        .gateway-btn {
            display: block;
            text-align: center;
            background-color: var(--accent);
            color: #0f172a;
            text-decoration: none;
            font-weight: 600;
            padding: 0.65rem 1rem;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .gateway-btn:hover {
            background-color: var(--accent-hover);
            color: #fff;
        }
        footer {
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--muted);
            font-size: 0.9rem;
        }
        .counter-box {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 999px;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <a href="https://kolobeznik.cz" class="back-link">&larr; Zpět na rozcestník Koloběžník.cz</a>
        <h1>📱 České SMS Brány</h1>
        <p>Přehled ověřených bran pro odesílání SMS zpráv z internetu do českých mobilních sítí.</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-input" placeholder="Hledat bránu nebo operátora...">
        <button class="filter-btn active" data-filter="all">Všechny (7)</button>
        <button class="filter-btn" data-filter="ok">Bez registrace</button>
        <button class="filter-btn" data-filter="reg">S registrací</button>
        <button class="filter-btn" data-filter="limit">Omezené</button>
    </div>

    <main id="gatewaysGrid"></main>

    <footer>
        <div class="counter-box">
            <span>👁️ Počet návštěv SMS brány:</span>
            <span id="visit-counter">Načítám...</span>
        </div>
        <p>&copy; 2026 SMS.Koloběžník.cz</p>
    </footer>

    <script>
        const gateways = [
            {
                name: "PoslatSMS.cz",
                operator: "Všichni operátoři (O2, T-Mobile, Vodafone)",
                status: "ok",
                statusText: "Plně funkční",
                desc: "Oblíbená česká univerzální brána zdarma a bez registrace. Délka zprávy až 160 znaků.",
                url: "https://www.poslatsms.cz/"
            },
            {
                name: "SMS.cz",
                operator: "Všichni operátoři",
                status: "ok",
                statusText: "Plně funkční",
                desc: "Tradiční česká SMS brána s jednoduchým rozhraním a okamžitým odesláním.",
                url: "https://www.sms.cz/"
            },
            {
                name: "PosliSMS.cz",
                operator: "Všichni operátoři",
                status: "ok",
                statusText: "Plně funkční",
                desc: "Rychlé odesílání zpráv zdarma bez nutnosti zakládat účet, podpora historie.",
                url: "https://www.poslisms.cz/"
            },
            {
                name: "T-Mobile SMS brána (T-Zones)",
                operator: "Pouze T-Mobile",
                status: "reg",
                statusText: "Vyžaduje registraci",
                desc: "Oficiální brána operátora T-Mobile. Vyžaduje přihlášení do účtu Můj T-Mobile.",
                url: "https://www.t-mobile.cz/"
            },
            {
                name: "Vodafone Park / Můj Vodafone",
                operator: "Pouze Vodafone",
                status: "reg",
                statusText: "Vyžaduje registraci",
                desc: "Oficiální webová brána pro zákazníky Vodafone po přihlášení do samoobsluhy.",
                url: "https://www.vodafone.cz/"
            },
            {
                name: "SMS-brana.cz",
                operator: "Všichni operátoři",
                status: "limit",
                statusText: "Denní limit zpráv",
                desc: "Funguje bez registrace, ale má omezený celkový denní počet odeslaných zpráv zdarma.",
                url: "https://www.sms-brana.cz/"
            },
            {
                name: "Kubík SMS / Brána zdarma",
                operator: "Všichni operátoři",
                status: "limit",
                statusText: "S opisem kódu",
                desc: "Základní brána s ochranou proti robotům (CAPTCHA) a kratší délkou jedné zprávy.",
                url: "https://sms.sluzba.cz/"
            }
        ];

        const grid = document.getElementById('gatewaysGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let currentFilter = 'all';

        function renderGateways() {
            const query = searchInput.value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = gateways.filter(gw => {
                const matchesFilter = currentFilter === 'all' || gw.status === currentFilter;
                const matchesSearch = gw.name.toLowerCase().includes(query) ||
                                      gw.operator.toLowerCase().includes(query) ||
                                      gw.desc.toLowerCase().includes(query);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color: var(--muted); grid-column: 1/-1; text-align: center;">Žádná SMS brána neodpovídá zadanému filtru.</p>';
                return;
            }

            filtered.forEach(gw => {
                const badgeClass = gw.status === 'ok' ? 'badge-ok' : (gw.status === 'reg' ? 'badge-reg' : 'badge-limit');
                const card = document.createElement('div');
                card.className = 'gateway-card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h2>${gw.name}</h2>
                            <span class="badge ${badgeClass}">${gw.statusText}</span>
                        </div>
                        <div class="gateway-info">
                            <p><strong>Síť:</strong> ${gw.operator}</p>
                            <p>${gw.desc}</p>
                        </div>
                    </div>
                    <a href="${gw.url}" target="_blank" rel="noopener noreferrer" class="gateway-btn">Otevřít bránu &nearr;</a>
                `;
                grid.appendChild(card);
            });
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderGateways();
            });
        });

        searchInput.addEventListener('input', renderGateways);

        renderGateways();

        // Funkční počítadlo návštěv přes HTTPS (CounterAPI) - unikátní klíč pro SMS bránu
        const namespace = 'kolobeznik-cz-projekty';
        const key = 'sms-brana';

        fetch(`https://api.counterapi.dev/v1/${namespace}/${key}/up`)
            .then(response => {
                if (!response.ok) throw new Error('Chyba sítě');
                return response.json();
            })
            .then(data => {
                document.getElementById('visit-counter').textContent = data.count.toLocaleString('cs-CZ');
            })
            .catch(error => {
                console.error('Počítadlo se nepodařilo načíst:', error);
                document.getElementById('visit-counter').textContent = '1';
            });
    </script>

</body>
</html>
